<!DOCTYPE html>
<html>
<head>
    <title>My Favourite Person ❤️</title>

    <style>
        body {
            background: linear-gradient(#ffe4ec, #fff0f5);
            text-align: center;
            font-family: Georgia, serif;
            padding-top: 100px;
            color: #a83260;
        }

        h1 {
            font-size: 35px;
        }

        .heart {
            font-size: 100px;

        p {
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>To My Favourite Person</h1>

    <div class="heart" onclick="window.location.href='page2.html'">
        ❤️
    </div>

    <p>Tap on me 💌</p>

    <p>From your girlfriend, with love.</p>

</body>
</html>
